async function makePpt(){if(!reportState){status.textContent='Maak eerst de rapportage.';return}ppt.disabled=true;status.textContent='PowerPoint wordt opgebouwd...';try{const {c,p,both,mo,lab,client,cy}=reportState,P=new PptxGenJS();pptTheme(P);let cover=P.addSlide();cover.background={color:'FFFFFF'};try{const l=await logoData();if(l)cover.addImage({data:l,x:5.05,y:.85,w:3.2,h:1.05})}catch{}cover.addText('TraXall Kostenrapportage',{x:1,y:3.1,w:11.33,h:.55,fontFace:'Century Gothic',fontSize:28,bold:true,color:'213153',align:'center',margin:0});cover.addText(client,{x:1,y:3.82,w:11.33,h:.45,fontFace:'Century Gothic',fontSize:22,bold:true,color:'3E3E40',align:'center',margin:0});cover.addText(cy,{x:1,y:4.38,w:11.33,h:.4,fontFace:'Century Gothic',fontSize:20,color:'F6931C',align:'center',margin:0});
const ct=ms(c),pt=ms(p);let s1=[makeSeries(cy,lab,mo.map(m=>pptMoney(ct[m])),'bar')];if(both)s1.push(makeSeries(yr(p),lab,mo.map(m=>pptMoney(pt[m])),'line'));addChartSlide(P,both?'Totale kosten per maand':'Totale kosten',s1,false,client+' | '+cy);
const types=Object.values(TM).sort((a,b)=>a[1]-b[1]).map(x=>x[0]).filter(t=>c.some(x=>x.a===t));addChartSlide(P,'Totale kosten per kostensoort',types.map(t=>makeSeries(t,lab,mo.map(m=>pptMoney(sum(c,x=>x.m===m&&x.a===t))),'bar')),false,client+' | '+cy);
let lc=vc(c,'l'),hc=vc(c,'h'),lp=vc(p,'l'),hp=vc(p,'h'),vs=[makeSeries('Lease '+cy,lab,mo.map(m=>lc[m]),'bar'),makeSeries('Huur '+cy,lab,mo.map(m=>hc[m]),'bar')];if(both){vs.push(makeSeries('Lease '+yr(p),lab,mo.map(m=>lp[m]),'line'));vs.push(makeSeries('Huur '+yr(p),lab,mo.map(m=>hp[m]),'line'))}addChartSlide(P,'Aantal geprolongeerde voertuigen',vs,true,client+' | '+cy);
let all=lm(c);addChartSlide(P,'Gemiddelde prolongatiekosten en aantal leasevoertuigen (alle leveranciers)',[makeSeries('Prolongatiekosten',lab,mo.map(m=>pptMoney(all[m].a)),'bar'),makeSeries('Aantal leasevoertuigen',lab,mo.map(m=>all[m].c>0?all[m].c:null),'line')],false,client+' | '+cy);
const suppliers=[...new Set(c.filter(x=>n(x.prod)==='leasetarief').map(x=>x.sup))].sort();suppliers.forEach(s=>{let a=lm(c,s);addChartSlide(P,'Gemiddelde prolongatiekosten ('+s+')',[makeSeries('Prolongatiekosten',lab,mo.map(m=>pptMoney(a[m].a)),'bar'),makeSeries('Aantal leasevoertuigen',lab,mo.map(m=>a[m].c>0?a[m].c:null),'line')],false,client+' | '+cy);addTableSlides(P,'Prolongatiegegevens '+s,['Leverancier',...lab],[['Prolongatiekosten',...mo.map(m=>a[m].t)],['Aantal voertuigen',...mo.map(m=>a[m].c)],['Gemiddeld per voertuig',...mo.map(m=>a[m].a)]])});
const invoiceTypes=Object.values(TM).sort((a,b)=>a[1]-b[1]).filter(t=>c.some(x=>x.type===t[0]));invoiceTypes.forEach(t=>{let r=c.filter(x=>x.type===t[0]),spec=[...new Map(r.map(x=>[n(x.prod),{n:x.prod,o:x.po}])).values()].sort((a,b)=>a.o-b.o),rows=spec.map(s=>[s.n,...mo.map(m=>sum(r,x=>x.m===m&&n(x.prod)===n(s.n)))]);rows.push(['Subtotaal '+t[0],...mo.map(m=>sum(r,x=>x.m===m))]);addTableSlides(P,'Gefactureerde kosten: '+t[0],['Kostensoort',...lab],rows,rows.length-1)});await P.writeFile({fileName:'TraXall_Kostenrapportage_'+cy+'.pptx'});status.textContent='Bewerkbare PowerPoint is gegenereerd.'}catch(e){console.error(e);status.textContent='PowerPoint-export mislukt: '+e.message}finally{ppt.disabled=false}}
prev.onchange=()=>pn.textContent=prev.files[0]?.name||'Geen bestand';cur.onchange=()=>cn.textContent=cur.files[0]?.name||'Geen bestand';document.getElementById('run').onclick=run;document.getElementById('ppt').onclick=makePpt;</script></body></html>
