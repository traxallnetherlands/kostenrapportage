<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraXall Kostenrapportage Pro</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
body{font-family:"Century Gothic",sans-serif;background:#eef3f9;margin:0;color:#213153}
.header{background:#213153;color:#fff;padding:25px}
.container{max-width:1400px;margin:auto;padding:20px}
.section{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;page-break-inside:avoid}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#213153;color:white;padding:15px;border-radius:10px}
canvas{max-height:380px !important}
.table-wrap{overflow:auto}.report-table{width:100%;border-collapse:collapse;font-size:12px}.report-table th{background:#213153;color:#fff}.report-table th,.report-table td{border:1px solid #d8dce5;padding:6px}
@media print {.section{break-inside:avoid-page}}
</style>
</head><body>
<div class='header'><h1>TraXall Kostenrapportage</h1><input type='file' id='file'><button onclick='analyse()'>Analyse</button><button onclick='pdf()'>PDF</button></div>
<div class='container'><div id='report'>
<div class='section'><h2>Management Summary</h2><div id='summary'></div></div>
<div class='section'><div class='kpis' id='kpis'></div></div>
<div class='section'><canvas id='monthChart'></canvas></div>
<div class='section'><canvas id='supplierChart'></canvas></div>
<div class='section'><canvas id='categoryChart'></canvas></div>
<div class='section'><canvas id='vehicleChart'></canvas></div>
<div class='section'><h2>Leveranciers</h2><div class='table-wrap'><table class='report-table' id='supTable'></table></div></div>
</div></div>
<script>
let rows=[];
function parseAmount(v){return parseFloat(String(v??0).replace(/\./g,'').replace(',','.'))||0;}
function excelDate(v){if(typeof v==='number'){let d=new Date((v-25569)*86400*1000);return d;} let p=String(v).split(/[-/]/); if(p.length===3){return new Date(p[2],p[1]-1,p[0]);} return new Date(v);}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
async function analyse(){const f=document.getElementById('file').files[0];const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});build();};r.readAsArrayBuffer(f);}
function build(){let total=0,month={},supplier={},category={},vehicle={};rows.forEach(r=>{let amt=parseAmount(r.HT); total+=amt; let d=excelDate(r.Date); if(!isNaN(d)) month[monthKey(d)]=(month[monthKey(d)]||0)+amt; supplier[r.Fournisseur||'Onbekend']=(supplier[r.Fournisseur||'Onbekend']||0)+amt; category[r.Type_cout||'Onbekend']=(category[r.Type_cout||'Onbekend']||0)+amt; vehicle[r.Immat||'Onbekend']=(vehicle[r.Immat||'Onbekend']||0)+amt;});
let months=Object.keys(month).sort(); let latest=month[months[months.length-1]]||0; let previous=month[months[months.length-2]]||0; let diff=latest-previous;
let topSup=Object.entries(supplier).sort((a,b)=>b[1]-a[1])[0]; let topCat=Object.entries(category).sort((a,b)=>b[1]-a[1])[0];
document.getElementById('summary').innerHTML=`Totale kosten: € ${total.toLocaleString('nl-NL')}<br>Laatste maand: € ${latest.toLocaleString('nl-NL')}<br>Verschil t.o.v. vorige maand: € ${diff.toLocaleString('nl-NL')}<br>Grootste leverancier: ${topSup?.[0]}<br>Grootste kostensoort: ${topCat?.[0]}`;
document.getElementById('kpis').innerHTML=`<div class=kpi>Totaal<br>€ ${Math.round(total).toLocaleString('nl-NL')}</div><div class=kpi>Factuurregels<br>${rows.length}</div><div class=kpi>Leveranciers<br>${Object.keys(supplier).length}</div><div class=kpi>Kostensoorten<br>${Object.keys(category).length}</div>`;
new Chart(monthChart,{type:'line',data:{labels:months,datasets:[{label:'Kosten per maand',data:months.map(m=>month[m])}]}});
new Chart(supplierChart,{type:'bar',data:{labels:Object.keys(supplier),datasets:[{data:Object.values(supplier)}]}});
new Chart(categoryChart,{type:'pie',data:{labels:Object.keys(category),datasets:[{data:Object.values(category)}]}});
let topVeh=Object.entries(vehicle).sort((a,b)=>b[1]-a[1]).slice(0,10);
new Chart(vehicleChart,{type:'bar',data:{labels:topVeh.map(x=>x[0]),datasets:[{data:topVeh.map(x=>x[1])}]}});
let t='<tr><th>Leverancier</th><th>Bedrag</th></tr>';Object.entries(supplier).sort((a,b)=>b[1]-a[1]).forEach(x=>t+=`<tr><td>${x[0]}</td><td>€ ${x[1].toLocaleString('nl-NL')}</td></tr>`); document.getElementById('supTable').innerHTML=t;
}
function pdf(){html2pdf().set({margin:[8,8,8,8],filename:'TraXall_Kostenrapportage.pdf',pagebreak:{mode:['css','legacy']},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(document.getElementById('report')).save();}
</script></body></html>
