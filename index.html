<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TraXall Kostenrapportage</title><script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><style>body{font-family:Century Gothic,sans-serif;background:#f5f8fc;color:#213153;margin:0}.header{background:#213153;color:#fff;padding:20px}.container{max-width:1400px;margin:auto;padding:20px}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.kpis{display:flex;flex-wrap:wrap;gap:15px}.kpi{background:#213153;color:#fff;padding:15px;border-radius:10px;min-width:180px}button{background:#213153;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer}table{width:100%;border-collapse:collapse}th{background:#213153;color:#fff}td,th{padding:8px;border:1px solid #ddd}</style></head><body><div class="header"><h1>TraXall Kostenrapportage Generator</h1></div><div class="container"><div class="card"><input type="file" id="file" accept=".xlsx,.xls"><button onclick="analyse()">Analyse</button><button onclick="downloadPDF()">PDF</button></div><div id="report"><div class="card"><h2>Management Summary</h2><div id="summary"></div></div><div class="card"><div class="kpis" id="kpis"></div></div><div class="card"><canvas id="monthChart"></canvas></div><div class="card"><canvas id="supplierChart"></canvas></div><div class="card"><canvas id="categoryChart"></canvas></div><div class="card"><h2>Leveranciers</h2><table id="supplierTable"></table></div></div></div><script>let rows=[];function num(v){return parseFloat(String(v||0).replace(',','.'))||0}function analyse(){const f=document.getElementById('file').files[0];const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});build();};r.readAsArrayBuffer(f);}function build(){let total=0,sup={},cat={},month={};rows.forEach(r=>{let amt=num(r.HT);total+=amt;sup[r.Fournisseur||'Onbekend']=(sup[r.Fournisseur||'Onbekend']||0)+amt;cat[r.Type_cout||'Onbekend']=(cat[r.Type_cout||'Onbekend']||0)+amt;let m=(r.Date||'').toString().substring(0,7);month[m]=(month[m]||0)+amt;});document.getElementById('summary').innerHTML='Totale kosten: € '+total.toLocaleString('nl-NL',{maximumFractionDigits:2});document.getElementById('kpis').innerHTML='<div class=kpi>Totaal<br>€ '+total.toLocaleString('nl-NL')+'</div><div class=kpi>Factuurregels<br>'+rows.length+'</div><div class=kpi>Leveranciers<br>'+Object.keys(sup).length+'</div><div class=kpi>Kostensoorten<br>'+Object.keys(cat).length+'</div>';new Chart(document.getElementById('monthChart'),{type:'line',data:{labels:Object.keys(month),datasets:[{label:'Kosten',data:Object.values(month)}]}});new Chart(document.getElementById('supplierChart'),{type:'bar',data:{labels:Object.keys(sup),datasets:[{label:'Leveranciers',data:Object.values(sup)}]}});new Chart(document.getElementById('categoryChart'),{type:'pie',data:{labels:Object.keys(cat),datasets:[{data:Object.values(cat)}]}});let t='<tr><th>Leverancier</th><th>Bedrag</th></tr>';Object.entries(sup).sort((a,b)=>b[1]-a[1]).forEach(x=>t+='<tr><td>'+x[0]+'</td><td>€ '+x[1].toLocaleString('nl-NL',{maximumFractionDigits:2})+'</td></tr>');document.getElementById('supplierTable').innerHTML=t;}function downloadPDF(){html2pdf().from(document.getElementById('report')).set({filename:'TraXall_Kostenrapportage.pdf'}).save();}</script></body></html>
